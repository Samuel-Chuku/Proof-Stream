[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# Arc-proven settings (reused-from-bezant): Arc Testnet does not support
# post-paris opcodes, so pin the EVM version.
solc_version = "0.8.27"
evm_version = "paris"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.network"
