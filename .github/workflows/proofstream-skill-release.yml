name: Release ProofStream skill

on:
  push:
    tags:
      - "proofstream-skill-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: proofstream-skill-release
    # The `secrets` context is NOT available in a step-level `if:`, so
    # `if: secrets.X == 'true'` is always false and the publish step below was
    # silently skipped on every release. Read it into the job's env, where the
    # context IS available, and condition on that.
    env:
      PROOFSTREAM_NPM_PUBLISH: ${{ secrets.PROOFSTREAM_NPM_PUBLISH }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
      - run: pnpm --version
      - run: pnpm install --frozen-lockfile
      - name: Check tag and package version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#proofstream-skill-v}"
          version="$(node -p "require('./proofstream-skill/package.json').version")"
          test "$tag" = "$version"
          grep -q "## $version" proofstream-skill/CHANGELOG.md
      - run: forge build --root contracts
      - run: pnpm skill:release-dry-run
      - name: Require release metadata
        shell: bash
        run: |
          # `test -f <glob>` takes the glob's EXPANSION as its arguments, so two
          # matches make it "binary operator expected" rather than a clean
          # failure. Count the matches instead.
          shopt -s nullglob
          zips=(dist/proofstream-skill/*.zip)
          sums=(dist/proofstream-skill/*.sha256)
          test "${#zips[@]}" -ge 1
          test "${#sums[@]}" -ge 1
          node -e "const c=require('./proofstream-skill/generated/compatibility.json'); if(c.releaseStatus !== 'stable') process.exit(1)"
          test -n "$PROOFSTREAM_RELEASE_LICENSE_CONFIRMED"
        env:
          PROOFSTREAM_RELEASE_LICENSE_CONFIRMED: ${{ secrets.PROOFSTREAM_RELEASE_LICENSE_CONFIRMED }}
      - name: Publish npm package
        if: ${{ env.PROOFSTREAM_NPM_PUBLISH == 'true' }}
        run: pnpm --filter proofstream-integration-skill publish --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/proofstream-skill/*
